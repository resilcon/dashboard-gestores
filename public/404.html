<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Gestores — Resilcon</title>
    <script type="text/javascript">
      // GitHub Pages é um servidor de arquivos estático: uma rota do
      // React Router (ex: /dashboard-gestores/login) não existe como
      // arquivo real, então o GH Pages cai aqui. Redireciona de volta pra
      // index.html preservando o caminho pedido via querystring, e
      // index.html restaura esse caminho com history.replaceState antes
      // do React Router inicializar. Ver https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
